<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M5 ミニ気象観測</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --sub:#666; --card:#f3f5f7; --acc:#0a6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --sub:#999; --card:#1d2024; --acc:#4d9bff; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border-radius:12px; padding:12px 16px; margin:12px 0; }
  .val { font-size:32px; font-weight:600; }
  .sub { color:var(--sub); font-size:13px; }
  button { font-size:16px; padding:10px 16px; border:0; border-radius:10px; background:var(--acc); color:#fff; margin:4px 4px 4px 0; }
  button:disabled { opacity:.4; }
  input { font-size:16px; padding:8px; border-radius:8px; border:1px solid var(--sub); background:var(--bg); color:var(--fg); }
  #log { white-space:pre-wrap; font:12px/1.4 monospace; color:var(--sub); max-height:160px; overflow:auto; }
</style>
</head>
<body>
<h1>M5 ミニ気象観測</h1>
<p class="sub">iPhone では <b>Bluefy</b> で開いてください（Safari は Bluetooth 非対応）。</p>

<button id="conn">接続</button>
<span id="state" class="sub">未接続</span>

<div class="card">
  <div class="sub" id="ts">--</div>
  <div class="val"><span id="t">--</span> ℃　<span id="h">--</span> %</div>
  <div class="val"><span id="p">--</span> hPa</div>
  <div class="sub">電池 <span id="b">--</span> %</div>
</div>

<div class="card">
  <div>ログ取得（日単位）</div>
  <input type="date" id="date">
  <button id="dl" disabled>取得して保存</button>
  <div class="sub" id="dlstate"></div>
</div>

<div id="log"></div>

<script>
// UUID は docs/data_format.md と一致させる
const SVC = 'b5dcd81f-8818-4a59-8055-4be29e1ab1ab';
const CUR = '93201d96-eec6-4b2f-a728-2fd5f41d8512';
const CTL = 'cfb36b51-d385-497f-ad44-3f4b9bf0e9b6';
const LOG = 'd6ee814f-18a7-4682-9420-06a34fc0a78a';
const $ = id => document.getElementById(id);
const dec = new TextDecoder();
const enc = new TextEncoder();
let ctl, logCh, lines = [], onDone = null;

const log = m => { $('log').textContent = m + '\n' + $('log').textContent; };

// 現在値（CSV 1行: timestamp,temp,hum,pres,battery）を画面へ
function showCurrent(row) {
  const [ts, t, h, p, b] = row.split(',');
  $('ts').textContent = ts;
  $('t').textContent = t || '--';
  $('h').textContent = h || '--';
  $('p').textContent = p || '--';
  $('b').textContent = b || '--';
}

$('date').valueAsDate = new Date();

$('conn').onclick = async () => {
  if (!navigator.bluetooth) { alert('Web Bluetooth が使えません。Bluefy で開いてください。'); return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    dev.addEventListener('gattserverdisconnected', () => { $('state').textContent = '切断されました'; $('dl').disabled = true; });
    $('state').textContent = '接続中...';
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SVC);
    const cur = await svc.getCharacteristic(CUR);
    ctl = await svc.getCharacteristic(CTL);
    logCh = await svc.getCharacteristic(LOG);

    cur.addEventListener('characteristicvaluechanged', e => showCurrent(dec.decode(e.target.value)));
    await cur.startNotifications();
    try { showCurrent(dec.decode(await cur.readValue())); } catch (e) {}

    logCh.addEventListener('characteristicvaluechanged', e => {
      const s = dec.decode(e.target.value);
      if (s === 'END' || s === 'NOFILE') { if (onDone) onDone(s); return; }
      lines.push(s);
      $('dlstate').textContent = lines.length + ' 行 受信中...';
    });
    await logCh.startNotifications();

    $('state').textContent = '接続済み: ' + dev.name;
    $('dl').disabled = false;
  } catch (e) { $('state').textContent = '接続失敗'; log(String(e)); }
};

$('dl').onclick = async () => {
  const d = $('date').value;  // YYYY-MM-DD
  if (!d) return;
  const ymd = d.replaceAll('-', '');
  lines = [];
  $('dlstate').textContent = '要求中...';
  const done = new Promise(r => { onDone = r; });
  await ctl.writeValue(enc.encode('DATE,' + ymd));
  const res = await done;
  onDone = null;
  if (res === 'NOFILE') { $('dlstate').textContent = 'その日のデータはありません'; return; }
  $('dlstate').textContent = lines.length + ' 行 取得完了';
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ymd + '.csv';
  a.click();
};
</script>
</body>
</html>
